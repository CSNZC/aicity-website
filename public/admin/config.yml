backend:
  name: github
  repo: CSNZC/aicity-website
  branch: main
  base_url: https://aicity-cms.casfzea.workers.dev
  auth_endpoint: auth
# 設定圖片上傳的儲存位置
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:

  # 首頁輪播圖
  - name: "carousel"
    label: "首頁輪播圖"
    folder: "src/content/carousel"
    create: true
    fields:
      - { label: "排序", name: "order", widget: "number", default: 0, hint: "數字越小越前面" }
      - { label: "圖片標題", name: "title", widget: "string" }
      - { label: "輪播圖片", name: "image", widget: "image" }
      - { label: "跳轉連結", name: "link", widget: "string", required: false }

  # 最新消息管理
  - name: "news"
    label: "最新消息"
    folder: "src/content/news"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" } 
      - { label: "發布日期", name: "date", widget: "datetime" } 
      - { label: "封面圖片", name: "image", widget: "image", required: false }
      
      # 頁面顯示開關
      - { label: "顯示於跑馬燈", name: "is_ticker", widget: "boolean", default: false, required: false }   
      - { label: "顯示於永續服務頁面", name: "is_service", widget: "boolean", default: false, required: false }   
      
      # 永續服務頁面專用欄位
      - { label: "活動時間與狀態", name: "event_status", widget: "string", required: false, hint: "若未填寫則預設顯示發布日期" }
      - { label: "開啟活動線上報名表", name: "enable_registration", widget: "boolean", default: false, required: false }
      
      - label: "分類標籤"
        name: "tags"
        widget: "select"
        multiple: true
        options:
          - { label: "公司消息", value: "公司消息" }
          - { label: "政府政策", value: "政府政策" }
          - { label: "課程資訊", value: "課程資訊" }
          - { label: "新知分享", value: "新知分享" }
          - { label: "其他", value: "其他" }
          
      - { label: "文章摘要", name: "summary", widget: "text", required: false }    
      - { label: "內文", name: "body", widget: "markdown" }
      
  # 關於我們官方認證
  - name: "about"
    label: "關於我們官方認證"
    folder: "src/content/about"
    create: true
    sortable_fields: ['weight', 'title'] # 允許透過 weight 排序
    fields:
      - { label: "排序", name: "weight", widget: "number", default: 0, hint: "數字越小越前面" }
      - { label: "標題", name: "title", widget: "string" }
      - { label: "敘述", name: "text", widget: "text" }  

  # 外聘講師
  - name: "lecturers"
    label: "外聘講師"
    folder: "src/content/partners"
    create: true
    extension: "md"
    format: "frontmatter"
    filter: { field: "category", value: "lecturer" } # 僅篩選講師
    fields:
      - { label: "講師姓名/名稱", name: "name", widget: "string" }
      - { label: "照片/Logo", name: "logo", widget: "image" }
      - { label: "個人/單位連結", name: "url", widget: "string", required: false }
      - { label: "分類", name: "category", widget: "hidden", default: "lecturer" }
      - { label: "排序權重", name: "weight", widget: "number", default: 0, value_type: "int" }
      - { label: "是否隱藏", name: "draft", widget: "boolean", default: false }

  # 合作企業夥伴
  - name: "enterprise_partners"
    label: "合作企業夥伴"
    folder: "src/content/partners"
    create: true
    extension: "md"
    format: "frontmatter"
    filter: { field: "category", value: "enterprise" } # 僅篩選企業夥伴
    fields:
      - { label: "企業名稱", name: "name", widget: "string" }
      - { label: "Logo 圖片", name: "logo", widget: "image" }
      - { label: "企業官網連結", name: "url", widget: "string", required: false }
      - { label: "分類", name: "category", widget: "hidden", default: "enterprise" }
      - { label: "排序權重", name: "weight", widget: "number", default: 0, value_type: "int" }
      - { label: "是否隱藏", name: "draft", widget: "boolean", default: false }

  # 公協會合作夥伴
  - name: "association_partners"
    label: "公協會合作夥伴"
    folder: "src/content/partners"
    create: true
    extension: "md"
    format: "frontmatter"
    filter: { field: "category", value: "association" } # 僅篩選公協會
    fields:
      - { label: "公協會名稱", name: "name", widget: "string" }
      - { label: "Logo 圖片", name: "logo", widget: "image" }
      - { label: "單位官網連結", name: "url", widget: "string", required: false }
      - { label: "分類", name: "category", widget: "hidden", default: "association" }
      - { label: "排序權重", name: "weight", widget: "number", default: 0, value_type: "int" }
      - { label: "是否隱藏", name: "draft", widget: "boolean", default: false }
  
  # 永續服務輪播圖
  - name: "service"
    label: "永續服務輪播圖"
    folder: "src/content/service"
    create: true
    fields:
      - { label: "圖片標題", name: "title", widget: "string" }
      - { label: "輪播圖片", name: "image", widget: "image" }
      - { label: "跳轉連結", name: "link", widget: "string", required: false }

  # ISO、iPAS、永續課程
  - name: "allcourses"
    label: "課程資訊"
    folder: "src/content/allcourses"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "課程名稱", name: "name", widget: "string" }
      - { label: "開課起始日期 (用於排序)", name: "start_date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "課程時間顯示文字", name: "date_time", widget: "string", hint: "例如：2026/05/10 - 2026/05/12 (共3天)" }
      - { label: "課程地點", name: "location", widget: "string" }
      - { label: "課程簡介 (卡片摘要)", name: "info", widget: "text", required: false }
      - { label: "報名連結", name: "url", widget: "string", required: false }
      - { 
          label: "分類標籤", 
          name: "category", 
          widget: "select", 
          options: [
            { label: "iPAS", value: "iPAS" },
            { label: "ISO", value: "ISO" },
            { label: "永續課程", value: "courses" },
          ]
        }
      - { 
          label: "報名狀態", 
          name: "registration_status", 
          widget: "select", 
          options: [
            { label: "即將開放", value: "upcoming" },
            { label: "開放報名", value: "open" },
            { label: "報名截止", value: "closed" }
          ],
          default: "upcoming"
        }
      - { label: "是否隱藏", name: "hide", widget: "boolean", default: false }
      - { label: "詳細內容 (課程介紹/講師介紹與照片)", name: "body", widget: "markdown", required: false }

  # 相關連結
  - name: "links"
    label: "相關連結"
    folder: "src/content/links" 
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "連結名稱", name: "name", widget: "string" }
      - { label: "內容超連結", name: "url", widget: "string", required: false }
      - { 
          label: "分類標籤", 
          name: "category", 
          widget: "select", 
          options: [
            { label: "政府資源", value: "government" },
            { label: "政策", value: "policy" },
            { label: "友善連結", value: "friendly" },
            { label: "報告書編製指引及參考網站", value: "guidelines" },
            { label: "碳盤查指引", value: "carbon" },
            { label: "iPAS 教材專區", value: "ipas" }
          ]
        }
      - { label: "是否隱藏", name: "draft", widget: "boolean", default: false }

  # 政府專區
  - name: "government"
    label: "政府專案"
    folder: "src/content/government"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "發布日期", name: "date", widget: "datetime" }
      - { label: "封面圖片", name: "image", widget: "image", required: false }
      - { label: "標籤狀態", name: "tag", widget: "string", default: "最新公告", required: false }
      - { label: "摘要", name: "summary", widget: "text" }
      - { label: "詳細內文", name: "body", widget: "markdown" }

 