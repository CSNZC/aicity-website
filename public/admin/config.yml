backend:
  name: github
  repo: CSNZC/aicity-website
  branch: main
  base_url: https://aicity-cms.casfzea.workers.dev
  auth_endpoint: auth


media_folder: "public/images/uploads"
public_folder: "/images/uploads"



collections:

# ======================
# 最新消息
# ======================

- name: "news"
  label: "最新消息"
  folder: "public/content/news"
  create: true
  slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

  fields:

    - label: "標題"
      name: "title"
      widget: "string"


    - label: "日期"
      name: "date"
      widget: "datetime"


    - label: "分類"
      name: "tag"
      widget: "string"


    - label: "摘要"
      name: "summary"
      widget: "text"


    - label: "內文"
      name: "body"
      widget: "markdown"




# ======================
# 首頁輪播
# ======================

- name: "carousel"
  label: "首頁輪播"

  folder: "public/content/carousel"

  create: true


  slug: "{{slug}}"


  fields:

    - label: "圖片名稱"
      name: "title"
      widget: "string"


    - label: "圖片"
      name: "image"
      widget: "image"


    - label: "排序"
      name: "order"
      widget: "number"


    - label: "連結"
      name: "link"
      widget: "string"
      required: false